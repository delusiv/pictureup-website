<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture Up — Coming Soon</title>
    <meta name="description" content="Picture Up — A cinematic creative collective. New site launching soon." />
  <meta name="theme-color" content="#090909" />
  <meta property="og:title" content="Picture Up — Coming Soon" />
  <meta property="og:description" content="A cinematic creative collective. New site launching soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://picture-up.co/" />
  <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/style.css" />
    <script>document.documentElement.classList.remove('no-js');</script>
  </head>
  <body>
  <a href="#main" class="skip-link">Skip to content</a>
    <canvas id="grain"></canvas>
    <header class="site-header">
      <div class="logo-compact" aria-label="Picture Up Logo">PICTURE<span>UP</span></div>
      <nav class="mini-nav" aria-label="Secondary Navigation">
        <a href="mailto:contact@picture-up.co" class="nav-link">Contact</a>
      </nav>
    </header>

  <main id="main" class="hero" role="main">
      <div class="hero-inner">
        <h1 class="title" aria-label="Title area">
          <span class="word-cycle" data-words='["DELIBERATE","PRECISE","NATURALISTIC","SUBTLE"]' aria-live="polite">
            <span class="word">DELIBERATE</span>
          </span>
          <span class="brand-line">
        </h1>

        <p class="tagline">We are building a new experience.<br class="br-hide"/> Coming <span id="launch-window">soon</span>.</p>

        <div class="progress-wrapper" aria-label="Progress indicator">
          <div class="progress-bar"><span class="fill"></span></div>
          <div class="progress-meta">
            <span class="phase-label">Phase: <strong id="phase" aria-live="polite">Concept</strong></span>
            <span class="eta" id="eta">ETA 2026</span>
          </div>
        </div>

        <div class="cta-group">
          <a href="mailto:contact@picture-up.co" class="cta primary">Collaborate</a>
          <button class="cta ghost" id="notifyBtn" aria-describedby="notifyDesc">Notify Me</button>
          <span id="notifyDesc" class="visually-hidden">Opens email draft to request launch notification</span>
        </div>

        <div class="micro-copy">© PICTURE UP LLC <span id="year"></span>. All rights reserved.</div>
      </div>
    </main>

    <footer class="social-footer">
      <ul>
        <li><a href="#" aria-label="Instagram" class="social ig">IG</a></li>
        <li><a href="#" aria-label="Vimeo" class="social vi">VI</a></li>
        <li><a href="#" aria-label="LinkedIn" class="social li">IN</a></li>
      </ul>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha256-7XUvAp9B9Cm6ANri/yUNdOxEFGz8yxmAjextU1nqlEw=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
  </body>
</html>
